# Mini-proxy du socket Docker — MOINDRE PRIVILÈGE RÉEL (restart uniquement).
#
# Pourquoi maison et pas tecnativa/docker-socket-proxy : ce dernier autorise TOUT /containers
# dès que CONTAINERS=1 + POST=1 (stop, start, create passent toujours — vérifié). On ne peut
# donc PAS y obtenir "restart seul". Ici, allowlist stricte : seules les routes dont le moteur
# de remédiation a besoin sont relayées ; tout le reste renvoie 403.
#
# Routes autorisées (exactement ce que le SDK Docker appelle pour lister + redémarrer) :
#   GET  /version                          (handshake du client Docker)
#   GET  /_ping                            (handshake)
#   GET  /<api>/containers/json            (lister)
#   GET  /<api>/containers/<id>/json       (inspecter — nécessaire au SDK avant restart)
#   POST /<api>/containers/<id>/restart    (la seule action d'écriture permise)

# root : nécessaire pour ouvrir /var/run/docker.sock (possédé par root). Ne change RIEN à ce
# que le moteur peut faire : la seule capacité exposée reste l'allowlist ci-dessous (restart).
user root;
events {}

http {
  access_log /dev/stdout;
  error_log  /dev/stderr;

  upstream docker { server unix:/var/run/docker.sock; }

  server {
    listen 2375;

    # --- Lecture : handshake + listing + inspection ---
    location = /version { proxy_pass http://docker; }
    location = /_ping   { proxy_pass http://docker; }

    # GET /<api>/containers/json  (listing). only_get bloque tout verbe non-GET.
    location ~ ^(/v[0-9.]+)?/containers/json$ {
      limit_except GET { deny all; }
      proxy_pass http://docker;
    }

    # GET /<api>/containers/<id>/json  (inspection d'un conteneur)
    location ~ ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/json$ {
      limit_except GET { deny all; }
      proxy_pass http://docker;
    }

    # --- Écriture : UNIQUEMENT restart ---
    location ~ ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/restart$ {
      limit_except POST { deny all; }
      proxy_pass http://docker;
    }

    # --- Tout le reste est refusé (create, stop, start, kill, exec, images, volumes, ...) ---
    location / { return 403; }
  }
}

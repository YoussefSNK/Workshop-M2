server {
  listen 80;
  # DNS interne de Docker : nginx re-résout les services à chaque requête.
  # Évite le piège "nginx garde la vieille IP d'un conteneur reconstruit" (-> 404/502).
  resolver 127.0.0.11 valid=10s;

  root /usr/share/nginx/html;
  index index.html;

  # Dashboard (SPA)
  location / { try_files $uri /index.html; }

  # Auth (service interne). Le rewrite retire le préfixe /auth/.
  location /auth/ {
    set $up_auth auth:8000;
    rewrite ^/auth/(.*)$ /$1 break;
    proxy_pass http://$up_auth;
  }

  # API métier via le WAF (gateway) — le trafic passe par ModSecurity.
  location /api/ {
    set $up_api gateway:8080;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$up_api;
  }

  # Moteur de remédiation (état + incidents).
  location /remediation/ {
    set $up_rem remediation-engine:9000;
    rewrite ^/remediation/(.*)$ /$1 break;
    proxy_pass http://$up_rem;
  }
}

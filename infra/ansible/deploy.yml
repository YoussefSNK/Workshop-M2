---
# Déploiement reproductible de la plateforme sur le PC Hôte.
- name: Déployer RESILIENCE-ALPHA
  hosts: host
  gather_facts: false
  vars:
    project_dir: "{{ playbook_dir }}/../.."
  tasks:
    - name: Vérifier que Docker répond
      command: docker info
      changed_when: false

    - name: Construire et démarrer la plateforme
      command: docker compose up -d --build
      args: { chdir: "{{ project_dir }}" }

    - name: Attendre que la Payment API réponde
      uri:
        url: http://localhost:8000/health
        status_code: 200
      register: health
      retries: 30
      delay: 3
      until: health.status == 200
